[project]
name = "voice-mimic"
version = "1.0.0"
description = "Real-Time Voice Biometric Party Game"
authors = [{ name = "Muaazl", email = "muaazl@example.com" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "soundfile>=0.12.1",
    "kaldi-native-fbank>=1.18.0",
    "onnxruntime>=1.16.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.9",
    "httpx>=0.25.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
